server:
  port: 8080

app:
  integrations:
    customer:
      url: http://localhost:8081
    billing:
      url: http://localhost:8081
    notification:
      url: http://localhost:8081
  observability:
    alerting:
      enabled: true
      defaultStepSlaMs: 1000
      defaultFlowSlaMs: 2000
      kafkaLagThreshold: 80
      sqsDepthThreshold: 40
      hikariPendingThreshold: 1
      stepSlaMs:
        "API Customer (GET /customers/{userId})": 500
        "API Billing (GET /billing/accounts/{userId})": 500
        "API Notificação (POST /notifications)": 500
        "Publicação Kafka (user-registration-topic)": 300
        "Publicação SQS (user-audit-queue)": 300
      flowSlaMs:
        "GET /api/v1/orchestrator/users/{userId}": 1000
        "Kafka Consumer: user-registration-topic": 2000

logging:
  level:
    com.gleidsonfersanp.observability: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: "*"
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

spring:
  application:
    name: user-orchestrator
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: http://localhost:4566
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: user-orchestrator-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: jdbc:h2:mem:observabilitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driverClassName: org.h2.Driver
    hikari:
      pool-name: observability-hikari-pool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      max-lifetime: 600000
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        generate_statistics: true

sqs:
  metrics:
    poll-delay: 10000
    queues:
      - customer-events-queue
      - billing-events-queue

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        ignoreExceptions:
          - com.gleidsonfersanp.observability.shared.ResourceNotFoundException
          - com.gleidsonfersanp.observability.shared.IntegrationBadRequestException
    instances:
      orchestrator:
        baseConfig: default
      customer-service:
        baseConfig: default
      billing-service:
        baseConfig: default
      notification-service:
        baseConfig: default

