apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger-traces

  - name: Jaeger
    uid: jaeger-traces
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    jsonData:
      nodeGraph:
        enabled: true

  - name: Loki
    uid: loki-logs
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      derivedFields:
        - datasourceUid: jaeger-traces
          matcherRegex: '"traceId":"([0-9a-fA-F]+)"'
          name: TraceID
          url: '$${__value.raw}'
